name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build and run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start preview and verify
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          preview_pid=$!
          trap 'kill $preview_pid' EXIT

          echo "Waiting for preview to become available..."
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              echo "Preview is available"
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:4173 >/dev/null
